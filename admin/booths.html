<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Booth Inventory | Snapora Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-[#FDF8F2] text-[#1F1A1C] antialiased">
  <div class="flex h-screen overflow-hidden">
    <div id="adminSidebarMount"></div>
    <div class="flex-1 flex flex-col overflow-hidden w-full">
      <div id="adminHeaderMount"></div>
      <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
        <div class="max-w-7xl mx-auto">
          <!-- Top Bar -->
          <div class="surface-card bg-white rounded-3xl border border-[#E6D8C7] p-4 sm:p-5 shadow-xs">
            <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 items-center">
              <div class="relative sm:col-span-6 lg:col-span-7">
                <i class="bi bi-search absolute start-3.5 top-1/2 -translate-y-1/2 text-[#84727B] text-xs"></i>
                <input
                  type="text"
                  id="admBoothSearch"
                  placeholder="Search booth name, category, or description..."
                  class="w-full ps-9 pe-4 py-2.5 rounded-xl border border-[#E6D8C7] bg-[#FAF3E8] text-xs font-semibold focus:outline-none focus:border-[#D9383A]"
                >
              </div>
              <div class="sm:col-span-3 lg:col-span-3">
                <select id="admBoothAvailFilter" aria-label="Filter by availability" class="w-full px-3.5 py-2.5 rounded-xl border border-[#E6D8C7] bg-[#FAF3E8] text-xs font-bold focus:outline-none focus:border-[#D9383A]">
                  <option value="All">All Availability</option>
                  <option value="Available">Available</option>
                  <option value="Limited">Limited</option>
                  <option value="Maintenance">Maintenance</option>
                </select>
              </div>
              <div class="sm:col-span-3 lg:col-span-2">
                <button type="button" onclick="window.PBAdmin.openBoothModal()" class="btn-cherry w-full !py-2.5 !px-4 text-xs flex items-center justify-center gap-1.5 shadow-sm">
                  <i class="bi bi-plus-circle-fill"></i>
                  <span>Add New Booth</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Booths Grid -->
          <div id="adminBoothsGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 mt-6"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/admin-dashboard.js"></script>
</body>
</html>
