<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Directory &amp; History | Snapora Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-[#FDF8F2] text-[#1F1A1C] antialiased">
  <div class="flex h-screen overflow-hidden">
    <div id="adminSidebarMount"></div>
    <div class="flex-1 flex flex-col overflow-hidden w-full">
      <div id="adminHeaderMount"></div>
      <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
        <div class="max-w-7xl mx-auto space-y-6">
          <!-- Top Bar -->
          <div class="surface-card bg-white rounded-3xl border border-[#E6D8C7] p-4 sm:p-5 shadow-xs">
            <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 items-center">
              <div class="relative sm:col-span-8 lg:col-span-9">
                <i class="bi bi-search absolute start-3.5 top-1/2 -translate-y-1/2 text-[#84727B] text-xs"></i>
                <input
                  type="text"
                  id="admCustSearch"
                  placeholder="Search customer by name, email, or phone number..."
                  class="w-full ps-9 pe-4 py-2.5 rounded-xl border border-[#E6D8C7] bg-[#FAF3E8] text-xs font-semibold focus:outline-none focus:border-[#D9383A]"
                >
              </div>
              <div class="sm:col-span-4 lg:col-span-3">
                <select id="admCustStatusFilter" aria-label="Filter by account status" class="w-full px-3.5 py-2.5 rounded-xl border border-[#E6D8C7] bg-[#FAF3E8] text-xs font-bold focus:outline-none focus:border-[#D9383A]">
                  <option value="All">All Statuses</option>
                  <option value="Active">Active</option>
                  <option value="VIP Client">VIP Client</option>
                  <option value="Inactive">Inactive</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Customers Table -->
          <div class="surface-card bg-white rounded-3xl border border-[#E6D8C7] p-6 shadow-xs">
            <div class="table-responsive">
              <table class="w-full text-start text-xs">
                <thead>
                  <tr class="border-b border-[#E6D8C7] text-[10px] font-extrabold uppercase tracking-wider text-[#84727B]">
                    <th class="py-3.5 px-3 text-start">Customer</th>
                    <th class="py-3.5 px-3 text-start">Contact</th>
                    <th class="py-3.5 px-3 text-start">Total Bookings</th>
                    <th class="py-3.5 px-3 text-start">Upcoming</th>
                    <th class="py-3.5 px-3 text-start">Completed</th>
                    <th class="py-3.5 px-3 text-start">Est. Spending</th>
                    <th class="py-3.5 px-3 text-start">Status</th>
                    <th class="py-3.5 px-3 text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="adminCustomersTableBody" class="divide-y divide-[#E6D8C7]"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/admin-dashboard.js"></script>
</body>
</html>
