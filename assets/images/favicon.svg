<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9383A"/>
      <stop offset="100%" stop-color="#9B1D20"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE182"/>
      <stop offset="100%" stop-color="#F4C95D"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#151018" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App Rounded Icon Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Photo Strip Ribbon (Nostalgic vertical strip poking out top-right) -->
  <g transform="rotate(12 44 20)" filter="url(#dropShadow)">
    <rect x="36" y="8" width="16" height="24" rx="3" fill="#FFFFFF" stroke="#FAF3E8" stroke-width="1"/>
    <rect x="38" y="10" width="12" height="6" rx="1" fill="#2B192E"/>
    <rect x="38" y="18" width="12" height="6" rx="1" fill="#D9383A"/>
    <circle cx="50" cy="27" r="1" fill="#F4C95D"/>
  </g>

  <!-- Retro Camera Body -->
  <g filter="url(#dropShadow)">
    <!-- Top Viewfinder / Flash Mound -->
    <rect x="18" y="19" width="14" height="6" rx="2" fill="#2B192E"/>
    <circle cx="25" cy="22" r="2" fill="url(#goldGrad)"/>

    <!-- Main Camera Chassis -->
    <rect x="12" y="23" width="40" height="28" rx="8" fill="#FAF3E8"/>
    <!-- Dark Textured Accent Band -->
    <rect x="12" y="29" width="40" height="15" fill="#2B192E"/>

    <!-- Lens Outer Ring & Reflection -->
    <circle cx="32" cy="37" r="11" fill="url(#goldGrad)"/>
    <circle cx="32" cy="37" r="9" fill="#151018"/>
    <circle cx="32" cy="37" r="6.5" fill="#2A7B76"/>
    <!-- Glint / Lens Reflection -->
    <circle cx="30" cy="35" r="2.5" fill="#FFFFFF" opacity="0.85"/>

    <!-- Camera Shutter Button -->
    <rect x="15" y="20" width="4" height="3" rx="1" fill="url(#goldGrad)"/>
    <!-- Flash Strobe -->
    <rect x="42" y="25" width="6" height="3" rx="1" fill="#FCE182"/>
  </g>

  <!-- Sparkle Accent -->
  <path d="M48 14 L49.5 17.5 L53 19 L49.5 20.5 L48 24 L46.5 20.5 L43 19 L46.5 17.5 Z" fill="#FCE182"/>
</svg>
